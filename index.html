<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Fàbrica de Jocs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: quadern de missions — mapa de missions a l'inici; cada missió és una pàgina: mira → pensa → construeix a Scratch */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface2:#F5F7FB; --ink:#1B2040; --muted:#525A7C; --line:#D5DAE8;
  --night:#161D47; --night2:#2A3170; --on-night:#F2F4FF; --on-night-muted:#B9C0E6;
  --go:#2C9A55; --stop:#D6453A; --ok:#22874A; --bad:#C63B30; --focus:#3B6BFF; --gold:#F2B705;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --ev:#FFBF00; --mo:#4C97FF; --lo:#9966FF; --so:#CF63CF; --co:#FFAB19; --se:#5CB1D6; --op:#59C059; --va:#FF8C1A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10142B; --surface:#1A1F3E; --surface2:#141934; --ink:#ECEFFA; --muted:#A8AFCE; --line:#2D345E;
  --night:#0A0E26; --night2:#1C2358; --go:#38B567; --stop:#E8584C; --ok:#4CC27A; --bad:#FF7B6E; --focus:#8FA8FF; --gold:#FFC933;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10142B; --surface:#1A1F3E; --surface2:#141934; --ink:#ECEFFA; --muted:#A8AFCE; --line:#2D345E;
  --night:#0A0E26; --night2:#1C2358; --go:#38B567; --stop:#E8584C; --ok:#4CC27A; --bad:#FF7B6E; --focus:#8FA8FF; --gold:#FFC933;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
a{color:var(--focus)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- night bands ---------- */
.night{background:var(--night);color:var(--on-night);position:relative;overflow:hidden;
  background-image:
   radial-gradient(1.6px 1.6px at 12% 22%,#fff 50%,transparent 52%),
   radial-gradient(1.2px 1.2px at 28% 70%,#fff 50%,transparent 52%),
   radial-gradient(2px 2px at 47% 18%,#FFE38A 50%,transparent 52%),
   radial-gradient(1.2px 1.2px at 63% 52%,#fff 50%,transparent 52%),
   radial-gradient(1.6px 1.6px at 78% 28%,#fff 50%,transparent 52%),
   radial-gradient(1.2px 1.2px at 90% 76%,#fff 50%,transparent 52%),
   radial-gradient(1.4px 1.4px at 6% 84%,#fff 50%,transparent 52%),
   radial-gradient(120% 140% at 85% 120%,var(--night2) 0%,transparent 60%);}
.hero-in{padding-block:40px 36px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr) auto;align-items:end}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);margin-top:6px}
.lead{color:var(--on-night-muted);max-width:34em;margin-top:10px}
.players{display:flex;gap:8px;flex-wrap:wrap}
.ptab{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--on-night);cursor:pointer;font-weight:700}
.ptab small{font-weight:400;color:var(--on-night-muted);font-size:14px}
.ptab[aria-selected="true"]{background:var(--on-night);color:var(--night);border-color:var(--on-night)}
.ptab[aria-selected="true"] small{color:#525A7C}
.pav{width:28px;height:28px;border-radius:50%;background:var(--pc);display:grid;place-items:center;flex:none}
.pav svg{width:18px;height:18px}

/* ---------- map ---------- */
.mapmain{display:flex;flex-direction:column;gap:40px;padding-block:28px 56px}
.game{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;align-items:center}
.gprev{border-radius:12px;overflow:hidden;line-height:0;background:var(--night)}
.gprev canvas{width:100%;height:auto;display:block}
.ginfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.ginfo h2{font-size:28px}
.namefld{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
.namefld input{font:700 20px var(--f-body);color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;max-width:280px}
.prog{height:14px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--ev),var(--va));border-radius:99px;transition:width .6s}
.pieces{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pieces li{font-size:14px;font-weight:700;padding:4px 10px;border-radius:99px;border:2px dashed var(--line);color:var(--muted)}
.pieces li.got{border:2px solid transparent;background:var(--cc);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.sh{font-size:32px;margin-bottom:14px}
.missions{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.missions.zero li:first-child{grid-column:1/-1}
.mcard{width:100%;height:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:12px;row-gap:2px;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);cursor:pointer;transition:transform .15s,border-color .15s}
.mcard:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cc)}
.mcard:disabled{cursor:not-allowed;opacity:.55}
.mno{grid-row:1/4;width:48px;height:48px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font:28px var(--f-display);text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:inset -6px -6px 0 rgba(0,0,0,.12)}
.mt{font:22px/1.15 var(--f-display)}
.mc{font-size:15px;color:var(--muted)}
.ms{font-size:14px;font-weight:700;align-self:end;margin-top:6px}
.ms.done{color:var(--ok)} .ms.next{color:var(--va)} .ms.lock{color:var(--muted)}
.mcard.next{border-color:var(--cc);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 22%,transparent)}
.missions.zero li:first-child .mcard{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto}
.missions.zero li:first-child .ms{grid-column:3;grid-row:1/3;align-self:center}

.families{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.families h2{font-size:26px;margin-bottom:10px}
.families ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:62em}
.allrow{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:16px;color:var(--muted)}
.allrow input{width:22px;height:22px}
.finalgame{border:3px solid var(--gold)}
.finalgame>h2{font-size:clamp(26px,4.5vw,34px);margin-bottom:14px}
.fgtxt{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.fgtxt .sayrow p{font-size:19px}
.diploma{border:4px double var(--gold);border-radius:20px;padding:28px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.diploma h2{font-size:clamp(28px,5vw,40px)}
.diploma .dn{font:clamp(30px,6vw,48px) var(--f-display);color:var(--va)}
.diploma .seal{width:84px;height:84px}

/* ---------- level page ---------- */
.lvtop-in{padding-block:18px 26px;display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--on-night);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:16px;font-weight:700}
.lvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.mnum{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:var(--gold);width:100%}
.lvhead h1{font-size:clamp(2.2rem,6vw,3.6rem)}
.concept{font-weight:700;font-size:16px;padding:4px 12px;border-radius:99px;background:var(--cc);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.story{max-width:40em;font-size:20px}
.sayrow{display:flex;gap:10px;align-items:flex-start}
.sayrow>p,.sayrow>span{flex:1;min-width:0}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;background:transparent;cursor:pointer;display:grid;place-items:center;opacity:.8}
.say:hover{opacity:1}
.say svg{width:20px;height:20px}
.lvmain{display:flex;flex-direction:column;gap:22px;padding-block:24px 56px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.sec>h2{font-size:28px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.stepn{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.idea{background:var(--surface2);border:2px solid var(--cc);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.idea h2{font-size:22px;color:var(--ink)}
.idea .sayrow p{font-size:20px;max-width:40em}
.watchgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.simcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{border-radius:12px;overflow:hidden;line-height:0;border:3px solid var(--line);background:var(--night)}
.stage canvas{width:100%;height:auto;display:block;touch-action:manipulation}
.simbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.flagbtn,.stopbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:17px}
.flagbtn{background:var(--go);color:#fff}
.flagbtn .flag{width:22px;height:22px;background:#fff;border-radius:5px;padding:2px}
.stopbtn{background:var(--surface2);border:2px solid var(--line)}
.stopi{width:16px;height:16px;background:var(--stop);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px;margin-left:auto}
.pad button{border-radius:10px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--mo);color:#fff}
.pad [data-dir=up]{grid-column:2}
.pad [data-dir=left]{grid-column:1;grid-row:2}.pad [data-dir=down]{grid-column:2;grid-row:2}.pad [data-dir=right]{grid-column:3;grid-row:2}
.simnote{font-size:16px;color:var(--muted)}
.simnote b{color:var(--ink)}
.tog{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2)}
.tog input{width:22px;height:22px}
.yread{font:700 16px var(--f-body);font-variant-numeric:tabular-nums;display:inline-flex;gap:8px;align-items:center}
.yread span{background:var(--mo);color:#fff;border-radius:99px;padding:2px 12px;min-width:4.2em;text-align:center}
.capsa{display:flex;align-items:center;gap:14px}
.capsa .box{width:84px;height:66px;border-radius:8px 8px 12px 12px;background:var(--va);position:relative;display:grid;place-items:center;color:#fff;font:34px var(--f-display);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.capsa .box::before{content:"";position:absolute;left:-6px;right:-6px;top:-12px;height:14px;border-radius:6px;background:var(--va);filter:brightness(.88);transform-origin:left bottom;transition:transform .2s}
.capsa .box.pop::before{transform:rotate(-24deg)}
.capsa .box.pop span{animation:bump .35s}
@keyframes bump{0%{transform:translateY(-14px) scale(1.4)}100%{transform:none}}

.scripts{background-color:var(--surface2);background-image:radial-gradient(circle,var(--line) 1.2px,transparent 1.3px);background-size:18px 18px;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:18px 22px;align-items:flex-start;overflow-x:auto;min-width:0}
.spr{display:flex;flex-direction:column;gap:6px;min-width:0}
.sprname{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.sprname svg{width:20px;height:20px}
.sprname em{font-style:normal;background:var(--ink);color:var(--bg);font-size:11px;padding:1px 6px;border-radius:4px;letter-spacing:.05em}
.scriptnote{font-size:14px;color:var(--muted);width:100%}

/* ---------- scratch-like blocks ---------- */
.ev{--cc:var(--ev)} .mo{--cc:var(--mo)} .lo{--cc:var(--lo)} .so{--cc:var(--so)} .co{--cc:var(--co)} .se{--cc:var(--se)} .op{--cc:var(--op)} .va{--cc:var(--va)}
.none{--cc:rgba(0,0,0,.22)} .inkc{--cc:var(--muted)}
.stack{display:flex;flex-direction:column;align-items:flex-start}
.b{display:flex;align-items:center;flex-wrap:wrap;gap:5px;color:#fff;font:700 15px/1.3 var(--f-body);padding:8px 12px;border-radius:6px;background:var(--cc);border:1px solid rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.25);width:max-content;max-width:100%;margin-top:-1px;transition:box-shadow .15s}
.b.hat{border-radius:24px 24px 6px 6px;padding-top:14px}
.b.c{display:flex;flex-direction:column;align-items:stretch;padding:0;background:none;border:0;text-shadow:none}
.b.c>.row{background:var(--cc);border:1px solid rgba(0,0,0,.2);border-bottom:0;border-radius:6px 6px 0 0;padding:8px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-width:150px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.b.c>.inner{border-left:16px solid var(--cc);display:flex;flex-direction:column;align-items:flex-start;min-height:22px;padding:1px 0}
.b.c>.foot{background:var(--cc);height:16px;border:1px solid rgba(0,0,0,.2);border-top:0;border-radius:0 0 6px 6px;min-width:150px}
.b.on,.b.c.on>.row,.b.c.on>.foot{box-shadow:0 0 0 3px #FFF36B,0 0 18px 3px #FFD500}
.b.c.on{box-shadow:none}
.b.c.off>.row,.b.c.off>.foot{opacity:.18}
.b.c.off>.inner{border-left-color:transparent}
.n{background:#fff;color:#3A3F55;border-radius:99px;padding:1px 9px;font-weight:700;text-shadow:none;min-width:1.6em;text-align:center}
.d{background:rgba(0,0,0,.16);border:1px solid rgba(0,0,0,.12);border-radius:5px;padding:1px 7px;display:inline-flex;gap:5px;align-items:center}
.d i{font-style:normal;font-size:.75em;opacity:.85}
.bool{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--cc);padding:3px 16px;min-width:44px;min-height:26px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);color:#fff}
.rep{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--cc);padding:2px 10px;border-radius:99px;border:1px solid rgba(0,0,0,.15);color:#fff}
.flag{width:20px;height:20px;vertical-align:middle;flex:none}
.nou{font:700 10px/1 var(--f-body);background:#fff;color:#C2185B;padding:3px 6px;border-radius:4px;letter-spacing:.08em;text-shadow:none;margin-left:4px}
.mini{display:inline-flex;vertical-align:middle;font-size:14px;padding:3px 9px;margin:2px 0;border-radius:5px}
.bool.mini{padding:3px 16px;border-radius:0}
.rep.mini{border-radius:99px}
.mini .flag{width:17px;height:17px}
.cat{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.cat::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--cc);border:1px solid rgba(0,0,0,.15)}

/* ---------- puzzles ---------- */
.pq{font-size:19px;font-weight:700;margin-bottom:12px;max-width:40em}
.opts{display:flex;flex-direction:column;gap:8px;max-width:36em}
.opt{text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px}
.opt:hover{border-color:var(--mo)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);opacity:.7}
.fb{margin-top:12px;font-weight:700;min-height:1.6em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.bugarea{padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow-x:auto}
.bugarea [data-id]{cursor:pointer}
.bugarea .b:not(.c):hover,.bugarea .b.c>.row:hover{filter:brightness(1.1);outline:3px dashed var(--ink);outline-offset:2px}
.hitok,.b.c.hitok>.row{box-shadow:0 0 0 4px var(--ok)!important}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ord{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ord .lab{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.pal,.dst{min-height:120px;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;overflow-x:auto}
.pal{background:var(--surface2);border:1px solid var(--line)}
.dst{border:3px dashed var(--line);gap:0}
.dst:empty::after{content:"Toca les peces per posar-les aquí, en ordre.";color:var(--muted);font-size:16px}
.tile{cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px}
.tile:hover .b{filter:brightness(1.08)}
.dst .tile{position:relative}
.dst .tile .ix{font:700 13px var(--f-body);color:var(--muted);width:20px;flex:none;text-align:right}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:2px solid transparent;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.big{font:24px var(--f-display);padding:14px 26px;border-radius:16px;letter-spacing:.02em}
.btn.go{background:var(--go);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- steps ---------- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface2);border:2px solid transparent;counter-increment:s}
.steps li.checked{border-color:var(--ok)}
.steps li::before{content:counter(s);font:22px/1 var(--f-display);width:34px;height:34px;border-radius:50%;background:var(--mo);color:#fff;display:grid;place-items:center}
.steps li.checked::before{content:"✓";background:var(--ok)}
.steps input{width:26px;height:26px;margin-top:4px;accent-color:var(--ok)}
.steps .tx{line-height:1.8}
.steps .say{width:34px;height:34px;color:var(--muted)}
.steps .say svg{width:16px;height:16px}
.hint{margin-top:14px;border-radius:12px;border:2px solid var(--line);padding:10px 14px}
.hint summary{cursor:pointer;font-weight:700}
.hint p{margin-top:8px}
.tipbox{margin-top:12px;font-size:16px;color:var(--muted)}
.extra{border:2px solid var(--gold)}
.extra .tx{line-height:1.9;max-width:44em}
.xchk{display:inline-flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;cursor:pointer}
.xchk input{width:24px;height:24px;accent-color:var(--gold)}
.finish{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px}
.needs{color:var(--muted);font-size:16px}
.adult{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px;color:var(--muted);max-width:36em}
.adult .lab2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

@media (max-width:560px){.missions.six{grid-template-columns:minmax(0,1fr)}}

<div id="app"></div>
<script>
/* ===================== helpers ===================== */
const W=480,H=360;
const GAMES=[];
const CATN={ev:'Esdeveniments',mo:'Moviment',lo:'Aparença',so:'So',co:'Control',se:'Sensors',op:'Operadors',va:'Variables',li:'Variables',pe:'Llapis',my:'Els meus blocs'};
const FLAG='<svg class="flag" viewBox="0 0 16 16" role="img" aria-label="bandera verda"><path d="M3.5 1.5v13" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M4.5 2.5h8.5l-2.2 3 2.2 3H4.5z" fill="#4CBF56" stroke="#2E7D32" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.4 1.8 1.4 5.2 0 7M18.8 6c2.6 3.3 2.6 8.7 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3" fill="var(--co)"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="var(--muted)" stroke-width="2.4"/><circle cx="12" cy="15.5" r="1.8" fill="#fff"/></svg>';
const ICONS={
 Nau:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 11l-3 5 3.5-1.5zM13.5 11l3 5-3.5-1.5z" fill="#E5484D"/><path d="M10 1.5c3.8 3 4 9 2.8 13.5H7.2C6 10.5 6.2 4.5 10 1.5z" fill="#EEF1F8" stroke="#7A84A6"/><circle cx="10" cy="8" r="2.2" fill="#4FB3FF" stroke="#5B6A9A"/></svg>',
 Estrella:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.4l-5.1 2.8L6 11.5l-4.3-4 5.8-.7z" fill="#FFD23F" stroke="#D99A00" stroke-linejoin="round"/></svg>',
 Meteorit:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l5 2 3 5-1 5-4 4-5 0-4-3-2-5 2-5z" fill="#8A6A52" stroke="#5E4636"/><circle cx="8" cy="8" r="2" fill="#6E5340"/><circle cx="13" cy="12" r="1.5" fill="#6E5340"/></svg>'
};
const ICOL=['#4C97FF','#9966FF','#CF63CF','#FFAB19','#5CB1D6','#59C059','#FF8C1A','#0FBD8C','#FF6680'];
function ICON(n){if(ICONS[n])return ICONS[n];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="${ICOL[h%ICOL.length]}"/><text x="10" y="14.2" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Verdana,sans-serif">${esc(n[0])}</text></svg>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function closeIx(s,i,o,c){let d=0;for(let j=i;j<s.length;j++){if(s[j]===o)d++;else if(s[j]===c){d--;if(d===0)return j}}return s.length-1}
function fmt(s){let out='',i=0;while(i<s.length){const ch=s[i];
  if(ch==='{'){const j=closeIx(s,i,'{','}');out+='<span class="n">'+esc(s.slice(i+1,j))+'</span>';i=j+1}
  else if(ch==='['){const j=closeIx(s,i,'[',']');out+='<span class="d">'+esc(s.slice(i+1,j))+'<i>▾</i></span>';i=j+1}
  else if(ch==='«'||ch==='‹'){const c=ch==='«'?'»':'›';const j=closeIx(s,i,ch,c);const inner=s.slice(i+1,j);const m=inner.match(/^([a-z]{2}):/);const cat=m?m[1]:'none';const body=m?inner.slice(3):inner;out+='<span class="'+(ch==='«'?'bool':'rep')+' '+cat+'">'+fmt(body)+'</span>';i=j+1}
  else if(ch==='⚑'){out+=FLAG;i++}
  else{out+=esc(ch);i++}}
 return out}
function blk(b){const cls=['b',b.c];if(b.hat)cls.push('hat');
 const at=(b.k?` data-k="${b.k}"`:'')+(b.id?` data-id="${b.id}" tabindex="0" role="button"`:'');
 const badge=b.nw?'<em class="nou">NOU</em>':'';
 if(b.body){const mid=b.t2?`<div class="mid">${fmt(b.t2)}</div><div class="inner">${(b.body2||[]).map(blk).join('')}</div>`:'';
  return `<div class="${cls.join(' ')} c"${at}><div class="row">${fmt(b.t)}${badge}</div><div class="inner">${b.body.map(blk).join('')}</div>${mid}<div class="foot"></div></div>`}
 return `<div class="${cls.join(' ')}"${at}>${fmt(b.t)}${badge}</div>`}
const stack=a=>'<div class="stack">'+a.map(blk).join('')+'</div>';
const B=(c,t)=>`<span class="b ${c} mini">${fmt(t)}</span>`;
const BB=(c,t)=>`<span class="bool ${c} mini">${fmt(t)}</span>`;
const R=(c,t)=>`<span class="rep ${c} mini">${fmt(t)}</span>`;
const CAT=c=>`<span class="cat ${c}">${CATN[c]}</span>`;
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
const rndf=(a,b)=>a+Math.random()*(b-a);
const hatFlag=(o={})=>Object.assign({c:'ev',t:'quan es faci clic a ⚑',hat:1},o);
const P=(x,y)=>[x+240,180-y];
const CF='"Atkinson Hyperlegible",Verdana,sans-serif';
const DF='"Lilita One","Trebuchet MS",sans-serif';

/* ===================== sound & speech ===================== */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f1,f2,dur,type,vol){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);g.gain.setValueAtTime(vol||.14,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02)}catch(e){}}
const SFX={pop:()=>tone(500,1300,.12,'sine',.16),hit:()=>tone(240,60,.3,'square',.07),
 win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,.2,'triangle',.13),i*130)),
 lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,f*.97,.28,'triangle',.12),i*200)),
 ok:()=>{tone(660,990,.14,'triangle',.12);setTimeout(()=>tone(990,1320,.16,'triangle',.1),120)},
 no:()=>tone(300,200,.18,'sine',.1),
 jump:()=>tone(300,700,.18,'sine',.12),
 note:f=>tone(f,f,.3,'triangle',.15),
 bonk:()=>tone(180,140,.08,'square',.06)};
const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\s+/g,' ').trim());const v=speechSynthesis.getVoices()||[];const vv=v.find(x=>/^ca/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang));if(vv){u.voice=vv;u.lang=vv.lang}else u.lang='ca-ES';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=()=>canSpeak?`<button type="button" class="say" aria-label="Escolta-ho en veu alta">${SPK}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('.say');if(!b)return;const t=b.closest('.sayrow,li');const src=t&&t.querySelector('.tx,p');if(src)speak(src.textContent)});

/* ===================== common drawing ===================== */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function bubble(c,x,y,txt,up){c.save();c.font='700 16px '+CF;const w=Math.min(W-8,c.measureText(txt).width+24),h=34;const bx=Math.min(Math.max(x-14,4),W-w-4);const off=up||36;let by=y-h-off;if(by<4)by=Math.min(y+off,H-h-4);
 c.fillStyle='#fff';c.strokeStyle='#B8BED3';c.lineWidth=2;rr(c,bx,by,w,h,12);c.fill();c.stroke();
 if(by<y){c.beginPath();c.moveTo(Math.max(bx+10,Math.min(x-6,bx+w-24)),by+h-1);c.lineTo(x,y-off+10);c.lineTo(Math.max(bx+22,Math.min(x+8,bx+w-10)),by+h-1);c.closePath();c.fill()}
 c.fillStyle='#1E2340';c.textBaseline='middle';c.fillText(txt,bx+12,by+h/2+1,w-20);c.restore()}
function monitors(c,list){let my=8;c.save();list.forEach(([lab,val])=>{c.font='700 13px '+CF;const v=String(val);const lw=c.measureText(lab).width,vw=Math.max(26,c.measureText(v).width+14);const w=lw+vw+20;c.fillStyle='rgba(233,237,245,.95)';rr(c,8,my,w,26,6);c.fill();c.fillStyle='#4A5170';c.textBaseline='middle';c.textAlign='left';c.fillText(lab,15,my+13.5);c.fillStyle='#FF8C1A';rr(c,15+lw+6,my+4,vw,18,9);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(v,15+lw+6+vw/2,my+13.5);my+=32});c.restore()}
const BGST=Array.from({length:70},(_,i)=>{const f=v=>v-Math.floor(v);return[f(Math.sin(i*12.9898)*43758.5453)*W,f(Math.sin(i*78.233)*12543.1)*H,(i%3)*.5+.6]});

/* ===================== generic simulation ===================== */
const KEYLAB={up:'▲',down:'▼',left:'◀',right:'▶',space:'Espai',q:'Q',w:'W',s:'S'};
const KEYARIA={up:'Amunt',down:'Avall',left:'Esquerra',right:'Dreta',space:'Tecla espai',q:'Tecla Q',w:'Tecla W',s:'Tecla S'};
const ARR=['up','left','down','right'];
function keyName(e){return {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'space'}[e.key]||(e.key&&e.key.length===1?e.key.toLowerCase():null)}
class Sim{
 constructor(host,E,lvl,o){this.E=E;this.L=lvl;this.o=o||{};this.rc={};this.glowing=new Set();this.threads=[];this.noLoop=false;this.ivs=[];this.endhl=null;
  const keys=E.pad?E.pad(lvl):[];this.keys=keys;const arrows=ARR.every(k=>keys.includes(k));const rest=keys.filter(k=>!(arrows&&ARR.includes(k)));
  const btn=k=>`<button type="button" data-key="${k}"${arrows&&ARR.includes(k)?` data-dir="${k}"`:''} aria-label="${KEYARIA[k]}">${KEYLAB[k]}</button>`;
  const pad=(arrows?`<div class="pad" role="group" aria-label="Fletxes">${ARR.map(btn).join('')}</div>`:'')+(rest.length?`<div class="pad free" role="group" aria-label="Tecles">${rest.map(btn).join('')}</div>`:'');
  host.innerHTML=`<div class="stage"><canvas width="480" height="360" role="img" aria-label="Simulació del joc"></canvas></div><form class="askrow" hidden><label for="askin"></label><input id="askin" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit" aria-label="Respon">✓</button></form><div class="simbar"><button type="button" class="flagbtn">${FLAG}<span>Comença</span></button><button type="button" class="stopbtn"><span class="stopi"></span><span>Atura</span></button>${pad}</div>`;
  const cv=host.querySelector('canvas');this.cv=cv;this.c=cv.getContext('2d');cv.style.touchAction=E.mouse?'none':'manipulation';
  const S=this.S={lvl,running:false,idle:true,over:null,say:'',mx:0,my:0,held:new Set(),t:0,dt:0};
  E.init(S,this);
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*480-240,180-(e.clientY-r.top)/r.height*360]};
  cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);S.mx=x;S.my=y});
  cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e);S.mx=x;S.my=y;if(E.mouse)e.preventDefault();if(S.running&&E.click)E.click(S,x,y,this)});
  this.form=host.querySelector('.askrow');this.inp=host.querySelector('#askin');
  this.form.addEventListener('submit',e=>{e.preventDefault();if(!this.askTh)return;S.answer=this.inp.value;this.inp.value='';this.form.hidden=true;this.askTh.asking=false;this.askTh=null;S.ask=null});
  host.querySelector('.flagbtn').onclick=()=>this.start();
  host.querySelector('.stopbtn').onclick=()=>this.stop();
  host.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;let iv=null;
   const end=()=>{clearInterval(iv);iv=null;S.held.delete(k)};
   b.addEventListener('pointerdown',e=>{e.preventDefault();if(!S.running)return;S.held.add(k);if(E.key)E.key(S,k,this);clearInterval(iv);if(E.repeat){iv=setInterval(()=>{if(S.running&&E.key)E.key(S,k,this)},75);this.ivs.push(iv)}});
   ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,end));
   b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(S.running&&E.key)E.key(S,k,this)}})});
  this.kd=e=>{if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=keyName(e);if(!k||!this.keys.includes(k)||!S.running)return;e.preventDefault();S.held.add(k);if(E.key&&(!e.repeat||E.repeat))E.key(S,k,this)};
  this.ku=e=>{const k=keyName(e);if(k)S.held.delete(k)};
  document.addEventListener('keydown',this.kd);document.addEventListener('keyup',this.ku);
  this.last=performance.now();this.loop=this.loop.bind(this);this.raf=requestAnimationFrame(this.loop)}
 cb(name,...a){const f=this.o[name];if(f)f(...a)}
 q(k){return k?document.querySelectorAll(`.scripts [data-k="${k}"]`):[]}
 paint(k){if(!k)return;const on=(this.rc[k]||0)>0||this.glowing.has(k)||this.endhl===k;this.q(k).forEach(e=>e.classList.toggle('on',on))}
 thl(th,k){if(th.hl===k)return;const o=th.hl;th.hl=k;if(o){this.rc[o]=(this.rc[o]||1)-1;this.paint(o)}if(k){this.rc[k]=(this.rc[k]||0)+1;this.paint(k)}}
 flash(k){this.q(k).forEach(e=>e.classList.add('on'));setTimeout(()=>this.paint(k),300)}
 refreshAll(){document.querySelectorAll('.scripts [data-k]').forEach(e=>this.paint(e.dataset.k))}
 clearHL(){this.threads.forEach(th=>this.thl(th,null));const ks=[...this.glowing];this.glowing.clear();ks.forEach(k=>this.paint(k));if(this.endhl){const e=this.endhl;this.endhl=null;this.paint(e)}}
 spawn(g){const th={g,wait:0,until:null,hl:null,asking:false,done:false};this.threads.push(th);return th}
 start(){ac();const S=this.S,E=this.E;this.clearHL();this.threads=[];
  Object.assign(S,{running:true,idle:false,over:null,overT:'',overS:'',say:'',t:0,ask:null,answer:''});S.held.clear();this.form.hidden=true;this.askTh=null;
  this.glowing=new Set(E.glow?E.glow(this.L,this):[]);this.glowing.forEach(k=>this.paint(k));
  E.start(S,this);if(E.threads)E.threads(S,this).forEach(g=>this.spawn(g))}
 stop(){const S=this.S;S.running=false;S.over=null;S.idle=true;S.say='';S.ask=null;this.form.hidden=true;this.askTh=null;this.clearHL();this.threads=[];if(this.E.stop)this.E.stop(S,this)}
 end(kind,title,sub,hl,say){const S=this.S;S.running=false;S.idle=false;S.over=kind;S.overT=title;S.overS=sub||'';if(say!==undefined)S.say=say;S.ask=null;this.form.hidden=true;this.clearHL();this.threads=[];if(hl){this.endhl=hl;this.paint(hl)}kind==='win'?SFX.win():SFX.lose()}
 askQ(th,q){th.asking=true;this.askTh=th;this.S.ask=q;this.form.hidden=false;this.form.querySelector('label').textContent=q;try{this.inp.focus({preventScroll:true})}catch(e){}}
 runThreads(){const S=this.S;for(const th of this.threads.slice()){if(!S.running)return;if(th.done)continue;
   if(th.wait>0){th.wait-=S.dt;if(th.wait>0)continue}
   if(th.until){if(!th.until())continue;th.until=null}
   if(th.asking)continue;
   for(let n=0;n<80;n++){let r;try{r=th.g.next()}catch(e){th.done=true;break}
    if(r.done){th.done=true;this.thl(th,null);break}
    const v=r.value;if(v===undefined)break;
    if(typeof v==='number'){th.wait=v;break}
    if(v.hl!==undefined){this.thl(th,v.hl);continue}
    if(v.until){th.until=v.until;break}
    if(v.ask!==undefined){this.askQ(th,v.ask);break}
    if(!S.running)break}}
  this.threads=this.threads.filter(t=>!t.done)}
 loop(now){const dt=Math.min(.05,(now-this.last)/1000);this.last=now;const S=this.S,E=this.E;
  if(S.running){S.t+=dt;S.dt=dt;if(E.update)E.update(S,dt,this);if(S.running)this.runThreads()}
  const c=this.c;c.save();E.draw(c,S);c.restore();if(E.mons)monitors(c,E.mons(S));this.overlay(c,S);this.raf=requestAnimationFrame(this.loop)}
 overlay(c,S){if(!(S.idle||S.over))return;c.save();c.fillStyle='rgba(10,14,40,.5)';c.fillRect(0,0,W,H);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
  if(S.over){c.font='40px '+DF;c.fillStyle=S.over==='win'?'#FFD23F':(S.over==='end'?'#9FE3FF':'#FF8A7A');c.fillText(S.overT,W/2,H/2-26,W-30);c.fillStyle='#fff';c.font='700 18px '+CF;if(S.overS)c.fillText(S.overS,W/2,H/2+12,W-30);c.font='700 15px '+CF;c.fillText('Clica «Comença» per tornar a jugar',W/2,H/2+44)}
  else{const t=this.E.idle?this.E.idle(this.L):['Clica «Comença»',''];c.font='32px '+DF;c.fillText(t[0],W/2,H/2-12);c.font='700 16px '+CF;if(t[1])c.fillText(t[1],W/2,H/2+24,W-30)}
  c.restore()}
 destroy(){cancelAnimationFrame(this.raf);document.removeEventListener('keydown',this.kd);document.removeEventListener('keyup',this.ku);this.ivs.forEach(clearInterval)}
}
/* animation helpers for engines */
function* glideTo(S,o,x1,y1,dur){const x0=o.x,y0=o.y,t0=S.t;while(true){const p=Math.min(1,(S.t-t0)/dur);o.x=x0+(x1-x0)*p;o.y=y0+(y1-y0)*p;if(p>=1)return;yield}}
function thumb(cv,G){try{const c=cv.getContext('2d');const S={lvl:G.final,running:false,idle:false,over:null,say:'',mx:0,my:0,held:new Set(),t:1,dt:0,thumb:true};G.engine.init(S,{noLoop:false});c.save();c.scale(cv.width/W,cv.height/H);G.engine.draw(c,S);c.restore()}catch(e){}}

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]]}return r}
function asBtn(el,fn){el.setAttribute('role','button');el.tabIndex=0;el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}})}

/* ===================== builder (Construeix el codi) ===================== */
function buildSpec(m){let n=0,g=0;const slots=[];const walk=b=>{const o=Object.assign({},b);if(b.g)g++;else{o.slot=n++;slots.push(b)}if(b.body)o.body=b.body.map(walk);if(b.body2)o.body2=b.body2.map(walk);return o};
 const trees=m.scripts.map(sc=>({spr:sc.spr,tag:sc.tag,b:sc.b.map(walk)}));return{trees,slots,hasGiven:g>0}}
const cleanB=b=>({c:b.c,t:b.t,hat:b.hat,body:b.body?[]:undefined,t2:b.t2,body2:b.t2?[]:undefined});
function mountBuild(el,i,onDone){const m=GAMES[CG].M[i],p=me();const {trees,slots,hasGiven}=buildSpec(m);
 const tiles=shuffle(slots.map((b,j)=>({id:'t'+j,b:cleanB(b)})).concat((m.distract||[]).map((b,j)=>({id:'x'+j,b:cleanB(b)}))));
 const T=id=>tiles.find(t=>t.id===id);
 const same=(tb,b)=>tb.t===b.t&&tb.c===b.c&&(tb.t2||'')===(b.t2||'');
 let fills=slots.map(()=>null),marks=false,done=p.built.includes(i)||p.done.includes(i);
 if(done){const used=new Set();slots.forEach((b,j)=>{const t=tiles.find(t=>!used.has(t.id)&&same(t.b,b));if(t){used.add(t.id);fills[j]=t.id}})}
 const okAt=j=>fills[j]!=null&&same(T(fills[j]).b,slots[j]);
 const firstEmpty=()=>fills.indexOf(null);
 const intro=(hasGiven?"Una part del codi ja hi és (la més clara). Omple els forats amb les peces que falten.":"Les instruccions estan barrejades. Toca-les en l'ordre correcte: cada peça va al primer forat buit.")+(m.distract?" Compte: hi ha una peça que sobra!":"")+" Si t'equivoques, toca la peça del programa i tornarà a les peces.";
 el.innerHTML=`<div class="sayrow"><p class="bintro tx">${intro}</p>${sayBtn()}</div><div class="ord"><div><div class="lab">Peces barrejades</div><div class="pal"></div></div><div><div class="lab">El teu programa</div><div class="bscripts"></div></div></div><div class="pbtns"><button type="button" class="btn chk">Comprova</button><button type="button" class="btn ghost hlp">Ajuda'm amb una peça</button><button type="button" class="btn ghost rst">Torna a començar</button></div><p class="fb" aria-live="polite"></p>`;
 const pal=el.querySelector('.pal'),bs=el.querySelector('.bscripts'),fb=el.querySelector('.fb'),btns=el.querySelector('.pbtns');
 const say=(cls,msg)=>{fb.className='fb '+cls;fb.textContent=msg};
 const node=b=>{const has=b.slot!==undefined;const tb=has?(fills[b.slot]!=null?T(fills[b.slot]).b:null):b;
  const bad=has&&marks&&fills[b.slot]!=null&&!okAt(b.slot);const nx=has&&!done&&b.slot===firstEmpty();
  const cls=(has?'':' given')+(bad?' bad':'')+(nx?' nextslot':'');const at=has?` data-slot="${b.slot}"`:'';
  if(b.body){const head=tb?fmt(tb.t):`<span class="slotn">${b.slot+1}</span>`;
   const mid=b.t2?`<div class="mid">${tb?fmt(tb.t2||''):''}</div><div class="inner">${(b.body2||[]).map(node).join('')}</div>`:'';
   return `<div class="b c ${tb?tb.c:'emptyc'}${cls}"${at}><div class="row">${head}</div><div class="inner">${b.body.map(node).join('')}</div>${mid}<div class="foot"></div></div>`}
  if(tb)return `<div class="b ${tb.c}${tb.hat?' hat':''}${cls}"${at}>${fmt(tb.t)}</div>`;
  return `<div class="slot${cls}"${at}><span class="slotn">${b.slot+1}</span></div>`};
 const check=auto=>{const empty=fills.filter(x=>x==null).length;
  if(empty){if(!auto)say('no',empty===1?"Falta 1 peça.":`Falten ${empty} peces.`);return}
  const wrong=slots.filter((_,j)=>!okAt(j)).length;
  if(!wrong){done=true;marks=false;if(!p.built.includes(i)){p.built.push(i);save()}draw();SFX.ok();say('ok',"Molt bé! Has construït el programa. Ara el codi apareix al pas 1: clica «Comença» i mira com s'encenen els blocs.");onDone();return}
  marks=true;draw();SFX.no();say('no',wrong===1?"Hi ha 1 peça fora de lloc. Està marcada amb ✕: toca-la per treure-la.":`Hi ha ${wrong} peces fora de lloc. Estan marcades amb ✕: toca-les per treure-les.`)};
 const draw=()=>{btns.hidden=done;pal.innerHTML='';const used=new Set(fills.filter(Boolean));
  tiles.filter(t=>!used.has(t.id)).forEach(t=>{const d=document.createElement('div');d.className='tile';d.innerHTML=stack([t.b]);
   if(!done){d.setAttribute('aria-label','Posa aquesta peça al programa');asBtn(d,()=>{const k=firstEmpty();if(k<0){say('no',"No queden forats. Treu una peça del programa si la vols canviar.");return}fills[k]=t.id;marks=false;say('','');draw();if(firstEmpty()<0)check(true)})}
   pal.appendChild(d)});
  if(!pal.children.length)pal.innerHTML=`<p class="simnote">${done?'Totes les peces al seu lloc!':'No queden peces.'}</p>`;
  bs.innerHTML=trees.map(sc=>`<div class="spr"><div class="sprname">${ICON(sc.spr)}${sc.spr}${sc.tag?`<em>${sc.tag}</em>`:''}</div><div class="stack">${sc.b.map(node).join('')}</div></div>`).join('');
  if(!done)bs.querySelectorAll('[data-slot]').forEach(s=>{const k=+s.dataset.slot;if(fills[k]==null)return;const tgt=s.classList.contains('c')?s.querySelector(':scope>.row'):s;tgt.setAttribute('aria-label','Treu aquesta peça');asBtn(tgt,e=>{e.stopPropagation();fills[k]=null;marks=false;say('','');draw()})})};
 el.querySelector('.chk').onclick=()=>check(false);

 idle:L=>['Clica «Comença»',L>=2?'i després pilota amb les fletxes':'i mira què fa el programa'],
 init(S){Object.assign(S,{rx:-30,ry:-110,sx:110,sy:70,sa:18,ex:-110,ey:110,er:.4,pts:0,lives:3,vel:-4,flame:S.thumb?1:0,blink:0,axes:S.lvl===1||S.lvl===6})},
 start(S,X){Object.assign(S,{rx:0,ry:-120,sa:0,pts:0,lives:3,vel:-4,flame:0,blink:0});if(S.lvl>=3){S.sx=rnd(-200,200);S.sy=rnd(-80,150);if(X.noLoop)S.sa=3}if(S.lvl>=6){S.ex=rnd(-200,200);S.ey=180}X.cb('onPts',0,false)},
 threads(S,X){return[(function*(){yield{hl:'s1'};yield .3;yield{hl:'s2'};S.rx=0;S.ry=-180;yield .2;yield{hl:'s3'};const t0=S.t;while(S.t-t0<1){S.ry=Math.round(-180+60*(S.t-t0));S.flame=.1;yield}S.ry=-120;yield{hl:'s4'};S.say='Hola! Som-hi!';yield 2;S.say='';if(S.lvl===1)X.stop()})()]},
 key(S,d,X){if(S.lvl<2||!ARR.includes(d))return;if(d==='right')S.rx+=10;if(d==='left')S.rx-=10;if(d==='up')S.ry+=10;if(d==='down')S.ry-=10;
  S.rx=Math.max(-225,Math.min(225,S.rx));S.ry=Math.max(-150,Math.min(150,S.ry));S.flame=.25;X.flash(d)},
 update(S,dt,X){const L=S.lvl;if(S.flame>0)S.flame-=dt;if(S.blink>0)S.blink-=dt;
  if(L>=3&&!X.noLoop)S.sa+=90*dt;
  if(L>=4&&Math.hypot(S.rx-S.sx,S.ry-S.sy)<36){SFX.pop();X.flash('touch');
   if(L>=5){S.pts++;X.flash('pts');X.cb('onPts',S.pts,true)}
   if(L>=8){S.vel-=1;X.flash('vel')}
   S.sx=rnd(-200,200);S.sy=rnd(-140,150)}
  if(L>=6){S.ey+=(L>=8?S.vel:-5)*30*dt;S.er+=dt*1.6;
   if(S.ey<-170){X.flash('mfall');S.ey=180;S.ex=rnd(-200,200)}
   if(L>=7&&Math.hypot(S.rx-S.ex,S.ry-S.ey)<34){S.lives--;SFX.hit();X.flash('hit');S.blink=.7;S.ey=180;S.ex=rnd(-200,200);if(S.lives<=0){X.end('go','Game Over','','go','Game Over!');return}}
   X.cb('onY',Math.round(S.ey))}
  if(L>=8&&S.pts>=10)X.end('win','Has guanyat!','Has atrapat 10 estrelles','win','Has guanyat!')},
 mons(S){const m=[];if(S.lvl>=5)m.push(['punts',S.pts]);if(S.lvl>=7)m.push(['vides',S.lives]);if(S.lvl>=8)m.push(['velocitat',S.vel]);return m},
 draw(c,S){spaceBg(c);if(S.axes)axes(c);const L=S.lvl;
  if(L>=3){const[x,y]=P(S.sx,S.sy);drawStar(c,x,y,S.sa)}
  if(L>=6){const[x,y]=P(S.ex,S.ey);drawMeteor(c,x,y,S.er)}
  if(L>=1){const[x,y]=P(S.rx,S.ry);c.save();if(S.blink>0&&Math.floor(S.blink*14)%2)c.globalAlpha=.25;drawRocket(c,x,y,S.flame>0);c.restore();if(S.say)bubble(c,x,y,S.say)}}
};

 c.fillStyle=`hsl(${hue},85%,58%)`;c.strokeStyle=`hsl(${hue},70%,35%)`;c.lineWidth=2;
 c.beginPath();c.moveTo(-16,0);c.lineTo(-30,-11);c.lineTo(-30,11);c.closePath();c.fill();c.stroke();
 c.beginPath();c.ellipse(0,0,20,12,0,0,7);c.fill();c.stroke();
 c.fillStyle='#fff';c.beginPath();c.arc(10,-3,4,0,7);c.fill();c.fillStyle='#1E1E1E';c.beginPath();c.arc(11,-3,2,0,7);c.fill();
 c.strokeStyle=`hsl(${hue},70%,35%)`;c.beginPath();c.arc(-2,0,8,-1,1);c.stroke();c.restore()}
function drawShark(c,x,y,dir){c.save();c.translate(x,y);c.scale(dir<0?-1:1,1);
 c.fillStyle='#8996AB';c.strokeStyle='#4E5A6E';c.lineWidth=2;
 c.beginPath();c.moveTo(-40,0);c.lineTo(-58,-16);c.lineTo(-52,0);c.lineTo(-58,16);c.closePath();c.fill();c.stroke();
 c.beginPath();c.moveTo(-8,-14);c.lineTo(2,-32);c.lineTo(12,-13);c.fill();c.stroke();

function drawHook(c,x,y){c.save();c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1.5;c.beginPath();c.moveTo(x,0);c.lineTo(x,y-10);c.stroke();

const E_PES={
 mouse:true,
 glow:L=>['floop','hloop','cloop','sloop','clone'],
 idle:L=>['Clica «Comença»',L>=2?"i mou l'ham amb el ratolí (o el dit)":'i mira com neda el peix'],
 init(S){Object.assign(S,{F:[newFish(S,{x:-90,y:20}),newFish(S,{x:80,y:-60,dir:-1,hue:200,size:.8}),newFish(S,{x:30,y:90,hue:320,size:.7})],hx:60,hy:40,sh:{x:-60,y:-40,dir:1},pts:0,bub:0})},
 start(S){Object.assign(S,{F:S.lvl<=2?[newFish(S,{x:-200,y:0})]:[],pts:0,sh:{x:0,y:-40,dir:1},hx:S.mx,hy:S.my})},
 threads(S,X){const L=S.lvl;if(L<3)return[];return[(function*(){
  if(L<6){for(let i=0;i<5;i++){X.flash('clone');S.F.push(newFish(S,L>=5?{hue:rnd(0,360),size:rndf(.55,1)}:{}));yield 1}return}
  while(true){X.flash('clone');S.F.push(newFish(S,{hue:rnd(0,360),size:rndf(.55,1)}));yield 1.5}})()]},
 update(S,dt,X){const L=S.lvl;
  if(L>=2){S.hx=Math.max(-230,Math.min(230,S.mx));S.hy=Math.max(-170,Math.min(150,S.my))}
  const tipx=S.hx,tipy=S.hy-6;
  S.F.forEach(f=>{f.x+=f.dir*3*30*dt;
   if(L<6){if(f.x>220||f.x<-220){f.dir=-f.dir;f.x=Math.max(-220,Math.min(220,f.x));if(L===1)X.flash('edge')}}
   else if(f.x>230){f.dead=true;X.flash('gone')}
   if(L>=2&&L!==3&&!f.dead&&Math.hypot(tipx-f.x,tipy-f.y)<22*f.size+6){S.pts++;SFX.pop();X.flash('catch');
    if(L===2){f.x=-200;f.y=rnd(-150,100);f.dir=1}else f.dead=true}});
  S.F=S.F.filter(f=>!f.dead);
  if(L>=6){S.sh.x+=S.sh.dir*4*30*dt;if(S.sh.x>190||S.sh.x<-190){S.sh.dir=-S.sh.dir;S.sh.x=Math.max(-190,Math.min(190,S.sh.x))}
   if(Math.abs(tipx-S.sh.x)<44&&Math.abs(tipy-S.sh.y)<18)X.end('go','Ñam!',`El tauró ha mossegat l'ham. Punts: ${S.pts}`,'shark','Ñam!')}
  S.bub=(S.bub+dt)%4},
 mons(S){return S.lvl>=2?[['punts',S.pts]]:[]},
 draw(c,S){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5CC8F0');g.addColorStop(1,'#0E5A8A');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(0,0,W,6);
  c.fillStyle='#E8D29A';c.beginPath();c.moveTo(0,H);c.lineTo(0,335);c.quadraticCurveTo(120,318,240,332);c.quadraticCurveTo(360,345,W,326);c.lineTo(W,H);c.fill();
  c.strokeStyle='#2F9E5C';c.lineWidth=5;c.lineCap='round';[[40,340],[60,345],[420,335],[445,340]].forEach(([x,y],i)=>{c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+(i%2?12:-12),y-40,x,y-80-(i%2)*20);c.stroke()});
  c.fillStyle='rgba(255,255,255,.4)';for(let i=0;i<6;i++){const by=H-((S.bub*60+i*60)%H);c.beginPath();c.arc(70+i*70,by,3+i%3,0,7);c.fill()}
  S.F.forEach(f=>{const[x,y]=P(f.x,f.y);drawFish(c,x,y,f.dir,f.hue,f.size)});
  if(S.lvl>=6){const[x,y]=P(S.sh.x,S.sh.y);drawShark(c,x,y,S.sh.dir);if(S.say)bubble(c,x,y-10,S.say)}
  if(S.lvl>=2||S.thumb){const[x,y]=P(S.hx,S.hy);drawHook(c,x,y)}}
};
